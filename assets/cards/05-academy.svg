<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 221" width="900" height="221" role="img" aria-label="ITAAR Academy, founded by Ouahiba: a practical learning initiative to learn, practice and share useful skills." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>ITAAR Academy, founded by Ouahiba: a practical learning initiative to learn, practice and share useful skills.</title>
<defs>
