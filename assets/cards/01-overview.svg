<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 224" width="900" height="224" role="img" aria-label="Telecom &amp; ICT State Engineer and DataOps &amp; Cloud Consultant building reliable systems across data engineering, cloud infrastructure, MLOps and telecom operations." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Telecom &amp; ICT State Engineer and DataOps &amp; Cloud Consultant building reliable systems across data engineering, cloud infrastructure, MLOps and telecom operations.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1330"/><stop offset="1" stop-color="#050b1f"/></linearGradient>
<radialGradient id="glow" cx="0.92" cy="0" r="0.75"><stop offset="0" stop-color="#4d9dff" stop-opacity="0.16"/><stop offset="1" stop-color="#4d9dff" stop-opacity="0"/></radialGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4d9dff" stop-opacity="0"/><stop offset="0.5" stop-color="#7db8ff"/><stop offset="1" stop-color="#4d9dff" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect width="900" height="224" rx="14"/></clipPath>
</defs>
<style>
.t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#dbe9ff}
.b{font-weight:700;fill:#7db8ff}
.ti{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:700;fill:#ffffff}
.h{font-family:'SF Mono','Fira Code',Consolas,'Liberation Mono','Courier New',monospace;font-weight:700;letter-spacing:1.6px;fill:#4d9dff}
.k{font-family:'SF Mono','Fira Code',Consolas,'Liberation Mono','Courier New',monospace;fill:#7db8ff}
.d{font-family:'SF Mono','Fira Code',Consolas,'Liberation Mono','Courier New',monospace;fill:#8fa6cc}
</style>
<g clip-path="url(#clip)">
<rect width="900" height="224" fill="url(#bg)"/>
<rect width="900" height="224" fill="url(#glow)"/>
<rect x="60" y="0" width="780" height="2" fill="url(#edge)"/>
<rect x="28" y="36" width="3" height="152" rx="1.5" fill="#4d9dff"/>
<text x="50" y="62" class="t" font-size="17" xml:space="preserve">I'm a <tspan class="b">Telecom</tspan> <tspan class="b">&amp;</tspan> <tspan class="b">ICT</tspan> <tspan class="b">State</tspan> <tspan class="b">Engineer</tspan> and <tspan class="b">DataOps</tspan> <tspan class="b">&amp;</tspan> <tspan class="b">Cloud</tspan> <tspan class="b">Consultant</tspan> focused on</text>
<text x="50" y="90" class="t" font-size="17" xml:space="preserve">building reliable systems at the intersection of <tspan class="b">data</tspan> <tspan class="b">engineering</tspan>, <tspan class="b">cloud</tspan></text>
<text x="50" y="118" class="t" font-size="17" xml:space="preserve"><tspan class="b">infrastructure</tspan>, <tspan class="b">MLOps</tspan>, and <tspan class="b">telecom</tspan> <tspan class="b">operations</tspan>.</text>
<text x="50" y="162" class="t" font-size="17" xml:space="preserve">I enjoy turning complex technical requirements into <tspan class="b">automated,</tspan> <tspan class="b">observable,</tspan> <tspan class="b">and</tspan></text>
<text x="50" y="190" class="t" font-size="17" xml:space="preserve"><tspan class="b">production-ready</tspan> <tspan class="b">solutions</tspan>.</text>
</g>
<rect x="0.5" y="0.5" width="899" height="223" rx="14" fill="none" stroke="#1b2f66"/>
</svg>
