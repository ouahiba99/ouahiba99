<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" width="1000" height="64" role="img" aria-label="Building reliable systems. Turning data into scalable solutions." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1330"/>
      <stop offset="1" stop-color="#050a1c"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#6fa8ff" opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="shell"><rect width="1000" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#shell)">
    <rect width="1000" height="64" fill="url(#bg)"/>
    <rect width="1000" height="64" fill="url(#scan)"/>
    <text x="500" y="38" text-anchor="middle" fill="#7db8ff" filter="url(#glow)" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="1.4">BUILDING RELIABLE SYSTEMS. TURNING DATA INTO SCALABLE SOLUTIONS.</text>
  </g>
  <rect x="0.75" y="0.75" width="998.5" height="62.5" rx="14" fill="none" stroke="#7db8ff" stroke-opacity="0.28" stroke-width="1.5"/>
</svg>
