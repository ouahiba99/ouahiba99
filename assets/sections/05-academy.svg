    <rect width="700" height="64" fill="url(#hl)"/>
    <rect y="0" width="1000" height="64" fill="url(#scan)"/>
    <rect x="0" y="14" width="4" height="36" fill="#7db8ff" filter="url(#glow)"/>
    <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-weight="700" font-size="16" letter-spacing="2.2">
      <text x="28" y="39" fill="#4d9dff">[05]</text>
      <text x="92" y="39" fill="#dbe9ff" filter="url(#glow)">ACADEMY</text>
    </g>
    <circle cx="936" cy="32" r="5" fill="#ff5f57"/>
    <circle cx="954" cy="32" r="5" fill="#ffbd2e"/>
    <circle cx="972" cy="32" r="5" fill="#28c840"/>
  </g>
  <rect x="0.75" y="0.75" width="998.5" height="62.5" rx="14" fill="none" stroke="#7db8ff" stroke-opacity="0.28" stroke-width="1.5"/>
</svg>
