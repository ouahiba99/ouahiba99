name: Generate Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ouahiba99
          outputs: |
            dist/github-contribution-graph.svg?palette=github-dark&color_snake=7ef9c6&color_dots=#0d1117,#163d35,#287a68,#42b89a,#7ef9c6
            dist/github-contribution-graph-dark.svg?palette=github-dark&color_snake=00d4ff&color_dots=#0d1117,#163d35,#287a68,#42b89a,#7ef9c6

      - name: Deploy generated graph
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
