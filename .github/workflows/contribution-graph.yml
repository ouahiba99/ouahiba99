name: Generate GitHub Contributions

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution graph
        uses: gautamkrishnar/github-contribution-grid-svg@v1
        with:
          github_user_name: ouahiba99

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move SVG to profile
        run: |
          mkdir -p profile
          mv github-contribution-grid.svg profile/contributions.svg

      - name: Commit SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/contributions.svg

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update GitHub contribution graph"
            git push
          fi