name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 3D contribution profile
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ouahiba99

      - name: Check generated SVG files
        run: |
          echo "=== Repository root ==="
          ls -la

          echo "=== 3D contribution directory ==="
          if [ -d "profile-3d-contrib" ]; then
            ls -lah profile-3d-contrib
          else
            echo "ERROR: profile-3d-contrib directory was NOT created"
            exit 1
          fi

          echo "=== SVG files ==="
          find profile-3d-contrib -type f -name "*.svg" -print

      - name: Commit and push 3D contribution profile
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git fetch origin main
          git reset --soft origin/main
          git reset

          git add profile-3d-contrib/

          if git diff --cached --quiet; then
            echo "No 3D contribution changes"
            exit 0
          fi

          git commit -m "chore: update GitHub 3D contribution profile"
          git push origin HEAD:main