name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        run: |
          mkdir -p profile

          curl -fL \
            "https://github-readme-stats.vercel.app/api?username=ouahiba99&show_icons=true&hide_border=true&theme=transparent&rank_icon=github" \
            -o profile/stats.svg

      - name: Generate Top Languages
        run: |
          curl -fL \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=ouahiba99&layout=compact&hide_border=true&theme=transparent" \
            -o profile/top-langs.svg

      - name: Validate SVG files
        run: |
          grep -q "<svg" profile/stats.svg
          grep -q "<svg" profile/top-langs.svg

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          git diff --cached --quiet || \
            git commit -m "chore: update GitHub stats"

          git push
