name: Generate GitHub Contributions

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ouahiba99

      - name: Prepare contribution SVG
        run: |
          set -e

          mkdir -p profile

          echo "Checking generated files..."

          if [ -f "profile-3d-contrib/profile-green-animate.svg" ]; then
            cp "profile-3d-contrib/profile-green-animate.svg" "profile/contributions.svg"
          elif [ -f "profile-3d-contrib/profile-green.svg" ]; then
            cp "profile-3d-contrib/profile-green.svg" "profile/contributions.svg"
          else
            echo "ERROR: No contribution SVG was generated."
            echo "Contents of profile-3d-contrib:"
            find profile-3d-contrib -maxdepth 2 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "Generated:"
          ls -lh profile/contributions.svg

      - name: Commit contribution graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git reset --soft origin/main
          git reset

          git add profile/contributions.svg

          if git diff --cached --quiet; then
            echo "No changes to contributions.svg"
            exit 0
          fi

          git commit -m "chore: update GitHub contribution graph"
          git push origin HEAD:main