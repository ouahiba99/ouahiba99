name: Generate GitHub Contributions

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ouahiba99

      - name: Prepare transparent contribution SVG
        run: |
          set -e

          mkdir -p profile

          echo "Checking generated files..."

          if [ -f "profile-3d-contrib/profile-green-animate.svg" ]; then
            cp "profile-3d-contrib/profile-green-animate.svg" "profile/contributions.svg"
          elif [ -f "profile-3d-contrib/profile-green.svg" ]; then
            cp "profile-3d-contrib/profile-green.svg" "profile/contributions.svg"
          else
            echo "ERROR: No contribution SVG was generated."
            find profile-3d-contrib -maxdepth 2 -type f -name "*.svg" -print 2>/dev/null || true
            exit 1
          fi

          echo "Removing SVG background..."

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("profile/contributions.svg")
          svg = path.read_text()

          # Remove common full-canvas background rectangles.
          svg = re.sub(
              r'<rect[^>]*(?:width=["'\'']100%["'\'']|width=["'\''][0-9.]+["'\''])[^>]*height=["'\'']100%["'\''][^>]*/?>',
              '',
              svg,
              flags=re.IGNORECASE
          )

          # Remove explicit white/black background rectangles.
          svg = re.sub(
              r'<rect[^>]*(?:fill=["'\''](?:#(?:fff|ffffff|000|000000)|white|black)["'\''])[^>]*/?>',
              '',
              svg,
              flags=re.IGNORECASE
          )

          # Remove SVG-level background styling.
          svg = re.sub(
              r'background(?:-color)?\s*:\s*(?:#[0-9a-fA-F]{3,8}|white|black)\s*;?',
              '',
              svg,
              flags=re.IGNORECASE
          )

          path.write_text(svg)

          print(f"Transparent SVG written to {path}")
          PY

          echo "Generated:"
          ls -lh profile/contributions.svg

      - name: Commit contribution graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git reset --soft origin/main
          git reset

          git add profile/contributions.svg

          if git diff --cached --quiet; then
            echo "No changes to contributions.svg"
            exit 0
          fi

          git commit -m "chore: update GitHub contribution graph"
          git push origin HEAD:main