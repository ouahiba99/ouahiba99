name: Generate GitHub Contributions

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare contribution SVG
        run: |
          mkdir -p profile

          if [ -f profile-3d-contrib/profile-green-animate.svg ]; then
            cp profile-3d-contrib/profile-green-animate.svg profile/contributions.svg
          elif [ -f profile-3d-contrib/profile-green.svg ]; then
            cp profile-3d-contrib/profile-green.svg profile/contributions.svg
          fi

      - name: Commit contribution graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/contributions.svg

          if git diff --cached --quiet; then
            echo "No changes to contributions.svg"
          else
            git commit -m "Update GitHub contribution graph"
            git push
          fi
