<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="Terminal: ouahiba99@github ./welcome --profile — DataOps, Cloud, MLOps, Telecom, Automation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1330"/>
      <stop offset="1" stop-color="#030816"/>
    </linearGradient>
    <radialGradient id="topglow" cx="0.5" cy="0" r="0.7">
      <stop offset="0" stop-color="#2f7bff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2f7bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#6fa8ff" opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="shell"><rect x="0" y="0" width="1000" height="230" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#shell)">
    <rect width="1000" height="230" fill="url(#bg)"/>
    <rect width="1000" height="230" fill="url(#topglow)"/>

    <!-- window header -->
    <rect width="1000" height="44" fill="#0a1633" opacity="0.95"/>
    <line x1="0" y1="44" x2="1000" y2="44" stroke="#7db8ff" stroke-opacity="0.24"/>
    <circle cx="30" cy="22" r="6" fill="#ff5f57"/>
    <circle cx="52" cy="22" r="6" fill="#ffbd2e"/>
    <circle cx="74" cy="22" r="6" fill="#28c840"/>
    <text x="100" y="27" fill="#dbe9ff" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.4">OUAHIBA@MATRIX:~$</text>

    <!-- prompt lines -->
    <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="18">
      <text x="32" y="92" fill="#7db8ff" font-weight="700" textLength="205" lengthAdjust="spacing">ouahiba99@github:~$</text>
      <text x="249" y="92" fill="#e3efff" filter="url(#glow)" textLength="205" lengthAdjust="spacing">./welcome --profile</text>
      <rect x="464" y="76" width="10" height="20" fill="#7db8ff" filter="url(#glow)">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="0.9s" repeatCount="indefinite"/>
      </rect>

      <text x="32" y="132" fill="#7db8ff" font-weight="700" textLength="65" lengthAdjust="spacing">status</text>
      <text x="112" y="132" fill="#e3efff" filter="url(#glow)" textLength="497" lengthAdjust="spacing">DataOps • Cloud • MLOps • Telecom • Automation</text>
    </g>

    <!-- badges -->
    <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.4" fill="#7db8ff" text-anchor="middle">
      <rect x="32" y="162" width="88" height="28" rx="14" fill="#0b1838" stroke="#4d9dff" stroke-opacity="0.34">
        <animate attributeName="stroke-opacity" values="0.3;0.75;0.3" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <text x="76" y="180">DATAOPS</text>

      <rect x="132" y="162" width="71" height="28" rx="14" fill="#0b1838" stroke="#4d9dff" stroke-opacity="0.34">
        <animate attributeName="stroke-opacity" values="0.3;0.75;0.3" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <text x="167.5" y="180">CLOUD</text>

      <rect x="215" y="162" width="71" height="28" rx="14" fill="#0b1838" stroke="#4d9dff" stroke-opacity="0.34">
        <animate attributeName="stroke-opacity" values="0.3;0.75;0.3" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <text x="250.5" y="180">MLOPS</text>

      <rect x="298" y="162" width="88" height="28" rx="14" fill="#0b1838" stroke="#4d9dff" stroke-opacity="0.34">
        <animate attributeName="stroke-opacity" values="0.3;0.75;0.3" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <text x="342" y="180">TELECOM</text>

      <rect x="398" y="162" width="114" height="28" rx="14" fill="#0b1838" stroke="#4d9dff" stroke-opacity="0.34">
        <animate attributeName="stroke-opacity" values="0.3;0.75;0.3" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <text x="455" y="180">AUTOMATION</text>
    </g>

    <!-- scanlines -->
    <rect y="44" width="1000" height="186" fill="url(#scan)"/>
  </g>

  <rect x="1" y="1" width="998" height="228" rx="22" fill="none" stroke="#5b9bff" stroke-opacity="0.45" stroke-width="1.5"/>
</svg>
